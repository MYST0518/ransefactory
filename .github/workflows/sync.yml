name: Sync Purchase Prices

on:
  schedule:
    # 毎日午前9時（日本時間）に実行
    - cron: '0 0 * * *'
  workflow_dispatch:
    # GitHubの画面から手動で即時実行するための設定

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Run Price Synchronization
      run: python sync_prices.py

    - name: Run Blog Synchronization
      run: python sync_blog.py
